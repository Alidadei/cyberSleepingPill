  <style>
    /* 时辰主题：夜=藕荷紫夜（站主 2026-09-10 配色图：藕荷紫 #B89BBF × 月砂灰 #DDD2CB）
     昼=琥珀棕 #8E705F × 雾杏粉 #E9D2C7（站主 2026-09-10 第二张配色图）。
     :root 存夜色为默认；昼色与渐变由 <head> 内主题脚本按本地时间插值写入（5–8 点渐亮、17–20 点渐暗）。
     层级三级：页面底 → 卡片亮一级 → 输入框暗一级。 */
    :root {
      --bg: #1c1626;
      --card: #272033;
      --input: #1e1829;
      --line: #403652;
      --ink: #ece4e1;
      --sub: #a897b0;
      --accent: #b89bbf;
      --act: #7d6199;
      --ok: #a5c9ae;
      --bad: #d98f8f;
      --accent2: #dcc3e2;
      --link: #c9b3d6;
      --nodeorb-rgb: 255, 255, 255;
      --ink-rgb: 236, 228, 225;
      --sub-rgb: 168, 151, 176;
      --accent-rgb: 184, 155, 191;
      --t: 0
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.8 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      padding: 56px 0 36px
    }

    /* 整页固定天空：夜=2D 星空画布，昼=个人站同款暖渐变；内容卡有实底，不受影响 */
    .page-sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none
    }

    #skyStars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: calc(1 - var(--t))
    }

    .sky-day {
      position: absolute;
      inset: 0;
      opacity: var(--t);
      background:
        radial-gradient(circle 340px at 80% 8%, rgba(255, 244, 214, .95), rgba(255, 228, 160, .35) 45%, transparent 72%),
        linear-gradient(180deg, #f5e6d3 0%, #f0d4c0 25%, #e8c8d8 55%, #d4c0e8 80%, #cfc5ec 100%)
    }

    /* 一盏暖灯：页顶极淡光晕（氛围元素，透明度 ≤0.06） */
    body::after {
      content: "";
      position: fixed;
      left: 50%;
      top: -140px;
      width: 640px;
      height: 340px;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(closest-side, rgb(var(--accent-rgb)/.05), transparent 72%)
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      padding: 0 14px
    }

    /* 手写体：入场信与问候（装饰字体至多一个，CDN+swap，失败回退系统楷体） */
    .hand {
      font-family: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
      letter-spacing: .05em
    }

    /* 品牌区：坐在整页天空之上（天空已改为整页固定背景） */
    .brand {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 34px 0 12px
    }

    /* 品牌图标：夜月昼日，随 --t 交叉淡化 */
    .bicon {
      display: inline-block;
      position: relative;
      width: 26px;
      height: 26px;
      vertical-align: -5px;
      margin-right: 8px
    }

    .bicon svg {
      position: absolute;
      inset: 0;
      width: 26px;
      height: 26px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 1.5s
    }

    .bicon .i-moon {
      opacity: calc(1 - var(--t))
    }

    .bicon .i-sun {
      opacity: var(--t)
    }

    h1 {
      font-size: 34px;
      color: var(--grey);
      font-weight: 400;
      letter-spacing: .04em;
      line-height: 1.4
    }

    .hand {
      font-family: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
      letter-spacing: .05em
    }

    .brand-line {
      width: 48px;
      height: 3px;
      border-radius: 2px;
      margin: 12px auto 0;
      background: linear-gradient(90deg, var(--accent), var(--accent2))
    }

    .sub {
      color: var(--sub);
      font-size: 15px;
      margin-top: 10px
    }

    .sub.hand {
      font-size: 17px
    }

    .greet {
      color: var(--sub);
      font-size: 15px;
      margin-top: 6px
    }

    /* 全屏入场：站主手写信逐字打出（手写体；限时兜底、可跳过、reduced-motion 直接跳过） */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      cursor: pointer;
      overflow: hidden;
      transition: opacity .8s ease
    }

    #intro.bye {
      opacity: 0;
      pointer-events: none
    }

    .intro-paper {
      max-width: 620px;
      max-height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      color: var(--ink)
    }

    .intro-text {
      font-size: 20px;
      line-height: 2.1;
      text-align: justify;
      white-space: pre-wrap;
      min-height: 10em
    }

    .intro-text::after {
      content: "▍";
      color: var(--grey);
      animation: introCaret 1.1s step-end infinite
    }

    .intro-text.done::after {
      content: ""
    }

    .intro-sign {
      margin-top: 16px;
      text-align: right;
      font-size: 17px;
      opacity: 0;
      transition: opacity .8s
    }

    .intro-sign.show {
      opacity: .85
    }

    .intro-hint {
      position: absolute;
      bottom: 26px;
      font-size: 12px;
      color: var(--sub);
      letter-spacing: .1em
    }

    @keyframes introCaret {
      50% {
        opacity: 0
      }
    }

    @media (max-width:640px) {
      #intro {
        padding: 16px 14px
      }

      .intro-text {
        font-size: 15px;
        line-height: 1.95
      }

      .intro-sign {
        font-size: 14px
      }
    }

    .chips {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0
    }

    .chip {
      background: none;
      border: none;
      color: var(--sub);
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      font-family: inherit;
      padding: 4px 6px;
      transition: color .2s
    }

    .chip:hover {
      color: var(--ink)
    }

    .chip.on {
      color: var(--grey)
    }

    /* 整卡可点：标题锚点 ::after 覆盖卡片；评分入口/星星行 position:relative 保持可点 */
    .card {
      position: relative;
      cursor: pointer;
      background: var(--card);
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      margin: 10px 0;
      transition: background-color .2s
    }

    .card:hover {
      background: rgb(var(--card-rgb)/.92)
    }

    @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
      .card {
        background: rgb(var(--card-rgb)/.4);
        backdrop-filter: blur(20px) saturate(1.2);
        -webkit-backdrop-filter: blur(20px) saturate(1.2);
        border: 1px solid rgb(var(--accent-rgb)/.12)
      }

      .card:hover {
        background: rgb(var(--card-rgb)/.55);
        border-color: rgb(var(--accent-rgb)/.25)
      }
    }

    .card:hover .t {
      color: var(--grey)
    }

    .card .head {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap
    }

    /* ranking：低调 mono 序号，第 1 名金灯点亮（站主要求 2026-09-10，替代「无名次」原案） */
    .card .rank {
      flex-shrink: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--sub);
      line-height: 1
    }

    .card .rank.top {
      color: var(--grey)
    }

    .card .t {
      min-width: 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: color .2s
    }

    .card .t::after {
      content: "";
      position: absolute;
      inset: 0
    }

    /* 电脑端：选中范围收窄到推荐标题，整卡点击覆盖仅移动端保留 */
    @media (min-width: 768px) {
      .card .t::after {
        content: none
      }

      .card {
        cursor: default
      }
    }

    .card .m {
      font-size: 13px;
      color: var(--sub);
      margin-top: 4px;
      word-break: break-all;
      overflow-wrap: anywhere;
      text-align: center
    }

    .star-mark {
      color: var(--grey);
      margin-right: 2px
    }

    .card .rate {
      position: relative;
      flex-shrink: 0;
      font-size: 13px;
      color: var(--grey);
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 2px 12px;
      font-family: inherit;
      transition: border-color .2s
    }

    .card .rate:hover {
      border-color: var(--accent)
    }

    .card .rate[aria-expanded="true"] {
      border-color: var(--accent)
    }

    .card .fav {
      position: relative;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      color: var(--grey);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px 9px;
      font-family: inherit;
      transition: border-color .2s, color .2s
    }

    .card .fav:hover,
    .card .fav.on {
      border-color: var(--accent);
      color: var(--accent)
    }

    .card .fav.on svg path {
      fill: currentColor
    }

    .type {
      display: inline-block;
      font-size: 12px;
      color: var(--grey);
      margin-right: 8px
    }

    .twin {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--sub);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 8px;
      margin-left: 8px;
      vertical-align: baseline
    }

    .twin svg {
      flex-shrink: 0
    }

    /* 星星打分控件（全站图腾）：hover/focus 逐颗预览，点击即提交 */
    .stars {
      position: relative;
      display: none;
      align-items: center;
      gap: 2px;
      margin-top: 8px
    }

    .stars.open {
      display: flex;
      justify-content: center
    }

    .star {
      background: none;
      border: none;
      padding: 3px;
      cursor: pointer;
      line-height: 0;
      border-radius: 4px
    }

    .star svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.5;
      stroke-linejoin: round;
      transition: fill .15s
    }

    .star.on svg {
      fill: var(--accent)
    }

    .stars .done {
      color: var(--ok);
      font-size: 13px;
      margin-left: 6px
    }

    .stars .oops {
      color: var(--bad);
      font-size: 13px;
      margin-left: 6px
    }

    .form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin: 22px 0
    }

    .form h3 {
      color: var(--ink);
      font-size: 16px;
      margin-bottom: 10px
    }

    input,
    select {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      padding: 9px 12px;
      font-size: 14px;
      margin: 6px 0;
      outline: none;
      font-family: inherit;
      transition: border-color .2s
    }

    input::placeholder {
      color: rgb(var(--sub-rgb)/.78)
    }

    input:focus,
    select:focus {
      border-color: var(--act)
    }

    .btn {
      background: var(--act);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 26px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
      transition: filter .2s
    }

    .btn:hover {
      filter: brightness(1.15)
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--sub)
    }

    .btn.ghost:hover {
      color: var(--ink);
      border-color: var(--act)
    }

    .msg {
      font-size: 13px;
      margin-top: 8px;
      display: none
    }

    .msg.ok {
      display: block;
      color: var(--ok)
    }

    .msg.bad {
      display: block;
      color: var(--bad)
    }

    .label {
      font-size: 13px;
      color: rgb(var(--ink-rgb)/.92)
    }

    #list {
      max-width: 440px;
      margin: 0 auto
    }

    /* 固定导航栏：不随页面滚动消失 */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      gap: 26px;
      justify-content: flex-end;
      align-items: center;
      margin: 0;
      padding: 9px 16px;
      background: rgb(var(--bg-rgb)/.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-wrap: wrap
    }

    /* 类型星图：散落节点（夜=星星，昼=光点），点击展开对应药方 */
    .nodes {
      position: relative;
      height: clamp(280px, 40vh, 420px);
      margin-top: -30px
    }

    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      min-width: 64px
    }

    .node-orb {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgb(var(--nodeorb-rgb));
      box-shadow: 0 0 14px 4px rgb(var(--accent-rgb)/.55);
      transition: box-shadow .3s, transform .3s, background-color .3s
    }

    .node.on .node-orb {
      transform: scale(1.45);
      box-shadow: 0 0 20px 7px rgb(var(--accent-rgb)/.8)
    }

    .node-label {
      font-size: 13px;
      color: var(--sub);
      transition: color .2s;
      white-space: nowrap
    }

    .node.on .node-label {
      color: var(--grey)
    }

    .node:hover .node-label {
      color: var(--grey)
    }

    /* 失眠原因搜索：隐形搜索框，手写体提示字，绝对居中于标签星图中央 */
    .search {
      display: block;
      width: min(320px, 60%);
      margin: 0 auto 18px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      border-radius: 0;
      color: var(--ink);
      padding: 12px 0;
      font-family: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
      font-size: 20px;
      text-align: center;
      outline: none;
      transition: opacity .3s
    }

    .search::placeholder {
      color: rgb(var(--sub-rgb)/.68);
      font-family: 'Ma Shan Zheng', 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
      font-size: 20px;
      letter-spacing: .04em
    }

    .search:focus {
      opacity: 1
    }

    .nodes .search {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      margin: 0;
      width: min(260px, 46%);
      padding: 10px 0
    }

    @media (max-width:640px) {
      .hamburger {
        display: block
      }

      .nav {
        display: none;
        position: fixed;
        top: 52px;
        left: 0;
        right: 0;
        z-index: 30;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
        background: rgb(var(--bg-rgb)/.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        align-items: flex-start
      }

      .nav.open {
        display: flex
      }

      .navitem {
        font-size: 16px;
        padding: 6px 0
      }

      .nodes {
        height: 280px;
        margin-top: -10px
      }

      .nodes .search {
        width: min(220px, 68%);
        font-size: 17px
      }

      .nodes .search::placeholder {
        font-size: 17px
      }

      .node {
        min-width: 56px
      }

      .node-label {
        font-size: 12px
      }

      input,
      select {
        font-size: 16px
      }

      .form {
        padding: 14px
      }

      .card {
        padding: 12px 14px
      }

      #list {
        max-width: 100%
      }

      .ranking-overlay {
        padding: 56px 10px 24px
      }

      .ranking-header {
        flex-wrap: wrap
      }

      footer div {
        margin-top: 0
      }
    }

    .navitem {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 16px;
      color: var(--sub);
      cursor: pointer;
      padding: 4px 2px;
      transition: color .2s
    }

    .navitem:hover {
      color: var(--grey)
    }

    .navitem[aria-expanded="true"] {
      color: var(--grey)
    }

    /* 手书灯箱：站长手书原稿 */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, .55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out
    }

    .lightbox.open {
      display: flex
    }

    .lightbox figure {
      margin: 0;

  <script>
    /* 时辰主题：按本地时间在夜/昼两套色板间连续插值。
       夜=藕荷紫夜（--t:0），昼=琥珀棕×雾杏粉（--t:1）；5–8 点渐亮、17–20 点渐暗。
       放在 <head>：先于正文算好颜色，避免日夜闪跳。调试可用 ?day=1 / ?day=0 强制。 */
    (function () {
      const NIGHT = { bg: [28, 22, 38], card: [39, 32, 51], input: [30, 24, 41], line: [64, 54, 82], ink: [236, 228, 225], sub: [168, 151, 176], accent: [184, 155, 191], act: [125, 97, 153], ok: [165, 201, 174], bad: [217, 143, 143], accent2: [220, 195, 226], link: [201, 179, 214], nodeorb: [255, 255, 255], grey: [250, 246, 240] };
      const DAY = { bg: [244, 235, 228], card: [236, 225, 216], input: [250, 245, 240], line: [217, 200, 188], ink: [80, 59, 44], sub: [94, 75, 59], accent: [122, 90, 69], act: [109, 83, 66], ok: [95, 138, 82], bad: [179, 90, 74], accent2: [224, 191, 174], link: [138, 95, 58], nodeorb: [255, 196, 110], grey: [250, 246, 240] };
      const smooth = t => t * t * (3 - 2 * t);
      let forced = null;
      try {
        const q = new URLSearchParams(location.search).get('day');
        if (q !== null && q !== '') {
          const n = parseFloat(q);
          forced = Number.isFinite(n) ? Math.min(1, Math.max(0, n)) : (q === '1' ? 1 : 0);
        }
      } catch (e) { }
      function dayT() {
        if (forced !== null) return forced;
        const h = new Date().getHours() + new Date().getMinutes() / 60;
        if (h >= 8 && h < 17) return 1;
        if (h >= 5 && h < 8) return smooth((h - 5) / 3);
        if (h >= 17 && h < 20) return 1 - smooth((h - 17) / 3);
        return 0;
      }
      function apply() {
        const t = dayT(), s = document.documentElement.style;
        /* 先算背景色相对亮度，据此决定文字色翻转窗口：
           - ink（主文字）在 bgL≈0.245 处翻转（夜=亮文字 / 昼=暗文字）
           - sub（次文字更暗）提前到 bgL≈0.18 处翻转，保证次文字也不掉进仲灰盲区
           翻转窗口仅 0.02 bgL，对应 real time ~4 分钟，过渡自然不突兀 */
        const rbg = (k) => NIGHT[k].map((n, i) => Math.round(n + (DAY[k][i] - n) * t));
        const bgC = rbg('bg');
        const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
        const bgL = 0.2126 * lin(bgC[0]) + 0.7152 * lin(bgC[1]) + 0.0722 * lin(bgC[2]);
        const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
        const flipInk = smooth((bgL - 0.235) / 0.02);   /* 0.235→0.255 */
        const flipSub = smooth((bgL - 0.17) / 0.02);    /* 0.17→0.19（sub 提前翻转） */
        for (const k of Object.keys(NIGHT)) {
          const tv = k === 'ink' ? flipInk : k === 'sub' ? flipSub : t;
          const c = NIGHT[k].map((n, i) => Math.round(n + (DAY[k][i] - n) * tv));
          s.setProperty('--' + k, '#' + c.map(n => n.toString(16).padStart(2, '0')).join(''));
          if (k === 'ink' || k === 'sub' || k === 'accent' || k === 'bg' || k === 'nodeorb') s.setProperty('--' + k + '-rgb', c.join(','));
        }
        s.setProperty('--t', t.toFixed(3));
        window.__dayT = t;
      }
      apply();
      window.__themeTick = apply;
    })();
  </script>

      defs.forEach((d, i) => {
        const key = d[0], label = d[1];
        const pos = NODE_SLOTS[i % NODE_SLOTS.length];
        const seed = (i * 7 + 3) % 11;
        const ox = (seed - 5) * 1.2;
        const oy = ((seed * 3 + 1) % 11 - 5) * 1.1;
        let x = Math.min(92, Math.max(4, pos[0] + ox + (i >= NODE_SLOTS.length ? 8 : 0)));
        let y = Math.min(90, Math.max(6, pos[1] + oy + (i >= NODE_SLOTS.length ? 18 : 0)));

          if (Math.abs(x - 50) / KW >= Math.abs(y - 50) / KH) x = x >= 50 ? 51 + KW : 49 - KW;
          else y = y >= 50 ? 51 + KH : 49 - KH;

    function searchScore(p, qL) {
      let score = 0;
      const title = (p.title || '').toLowerCase();
      if (title.includes(qL)) score += 3;
      const tl = typeLabel(p.type).toLowerCase();
      if (tl && tl.includes(qL)) score += 2;
      const rk = REASON_KEYS[p.type];
      if (rk && rk.some(k => k.includes(qL) || qL.includes(k))) score += 2;
      return score;
    }

        };

      const favOn = favMap().has(fk);
      const fav = document.createElement('button');
      fav.type = 'button';
      fav.className = 'fav focusable' + (favOn ? ' on' : '');
      fav.setAttribute('aria-pressed', String(favOn));
      fav.setAttribute('aria-label', favOn ? t('fav_remove') : t('fav_add'));
      fav.appendChild(bookmarkSvg());
      fav.onclick = () => {
        const now = toggleFav(fk, { title, url, type: type || null });
        fav.classList.toggle('on', now);
        fav.setAttribute('aria-pressed', String(now));
        fav.setAttribute('aria-label', now ? t('fav_remove') : t('fav_add'));
        if (currentRankingType === 'favs') rerenderRanking();
      };
      head.appendChild(fav);
      el.appendChild(head);

      const m = document.createElement('div');
      m.className = 'm';
      if (type) {

        m.appendChild(tag);
      }
      if (isCommunity && pick) {
        const avg = pick.ratings && pick.ratings.length
          ? (pick.ratings.reduce((x, y) => x + y, 0) / pick.ratings.length).toFixed(1) : null;
        if (avg) {
          m.appendChild(starMark());
          m.appendChild(document.createTextNode(' ' + t('ratings')(avg, pick.ratings.length)));
        } else {
          m.appendChild(document.createTextNode(hostOf(url)));
        }
        /* 站外导入的池外收藏没有 recommendCount，不显示推荐次数（未知 ≠ 1 次） */
        if (pick.recommendCount != null) {
          m.appendChild(document.createTextNode(' · ' + t('rec_times')(pick.recommendCount || 1)));
        }
      } else if (builtin && builtin.sampleRatingAvg != null) {
        m.appendChild(starMark());
        m.appendChild(document.createTextNode(' ' + t('ratings')(builtin.sampleRatingAvg.toFixed(1), builtin.sampleRatingCount)));
      } else {
        m.appendChild(document.createTextNode(hostOf(url)));

        if (isCommunity && pick && BUILTIN.some(b => urlKey(b.url) === urlKey(url))) m.appendChild(twinBadge());

          s.type = 'button';
          s.className = 'star focusable';
          s.setAttribute('aria-label', t('star_n')(i + 1));

          'So I thought: maybe there could be electronic content that actually makes you sleepy, yet stays light and fun. Pool our ideas, recommend picks to each other, and score them together — trust the wisdom of the crowd!',
          'And so this site was born. I hope it brings together honest shares of personally-tested cyber sleeping pills — electronic content only for now, with potential ads (and sales pitches) filtered out. So share boldly, and rest easy.',
          'Just a personal project — who knows how far it will go. Sweet dreams, everyone.'
        ]
      }
    };
    function t(k, ...a) {
      const v = (T[lang] && T[lang][k] !== undefined) ? T[lang][k] : T.zh[k];
      if (typeof v !== 'function') return v;
      return a.length ? v(...a) : v;   /* 带插值的词条需显式传参；无参调用返回函数本身 */
    }
    function set(id, k) { const el = document.getElementById(id); if (el) el.textContent = t(k); }
    function applyLang() {
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
      document.title = t('doc_title');
      set('navPublish', 'nav_prescribe'); set('navLetter', 'nav_letter'); set('navFavs', 'nav_favs');
      const lb = document.getElementById('navLang'); if (lb) lb.textContent = lang === 'zh' ? 'EN' : '中文';
      set('brandTitle', 'brand'); set('subtitle', 'subtitle');
      set('formTitle', 'form_title'); set('labelTitle', 'label_title'); set('labelUrl', 'label_url'); set('labelType', 'label_type');
      set('fSubmit', 'submit'); set('formHint', 'form_hint');
      set('letterCaption', 'letter_caption'); set('navAbout', 'nav_about');
      const sBox = document.getElementById('searchBox'); if (sBox) sBox.placeholder = t('search_ph');
      const ftIn = document.getElementById('fType'); if (ftIn) ftIn.placeholder = t('ph_type');
      renderTypeList();
      set('sisterApp', 'sister_app'); set('sisterName', 'sister_name');
      set('introHint', 'intro_hint'); set('introSign', 'intro_sign');
      const ft = document.getElementById('fType');
      if (ft && ft.options && ft.options.length) {
        ['opt_none', 'opt_anxiety', 'opt_excitement', 'opt_physical', 'opt_noise'].forEach((k, i) => { if (ft.options[i]) ft.options[i].textContent = t(k); });
      }
      const ft2 = document.getElementById('fTitle'); if (ft2) ft2.placeholder = t('ph_title');
      const fu = document.getElementById('fUrl'); if (fu) fu.placeholder = t('ph_url');
      const li = document.getElementById('letterImg'); if (li) li.alt = t('letter_alt');
      renderTypeList();
      render();
      rerenderRanking();
    }

    /* ================= 全屏入场：站长手写信逐字打出（手写体） =================
       reduced-motion 直接跳过；每个会话只播一次；点击/按键跳过；总时长有硬上限 */
    function buildIntro() {
      const intro = document.createElement('div');
      intro.id = 'intro';
      intro.setAttribute('aria-label', '站长的话');
      const paper = document.createElement('div');
      paper.className = 'intro-paper';
      const txt = document.createElement('div');
      txt.className = 'hand intro-text';
      txt.id = 'introText';
      const sign = document.createElement('div');
      sign.className = 'hand intro-sign';
      sign.id = 'introSign';
      sign.textContent = t('intro_sign');
      const hint = document.createElement('div');
      hint.className = 'intro-hint';
      hint.id = 'introHint';
      hint.textContent = t('intro_hint');
      paper.appendChild(txt); paper.appendChild(sign);
      intro.appendChild(paper); intro.appendChild(hint);
      return intro;
    }
    function removeStaticIntro() {
      const el = document.getElementById('intro');
      if (el) el.remove();
    }
    function playIntro() {
      removeStaticIntro();                      /* 先移除 HTML 静态占位层 */
      if (document.getElementById('intro')) return;   /* 已在播放（如重播连点）则不重复 */
      const intro = buildIntro();
      document.body.appendChild(intro);
      document.body.style.overflow = 'hidden';
      const NL = String.fromCharCode(10);
      const full = T[lang].intro_paras.join(NL + NL);
      const target = intro.children[0].children[0];
      const sign = intro.children[0].children[1];
      const hint = intro.children[1];
      let i = 0, timer = null, stage = 'typing';   /* typing →(交互) full 停住 →(再交互) 进入 */
      function updateHint() { hint.textContent = t(stage === 'full' ? 'intro_hint_enter' : 'intro_hint'); }
      function reveal() {
        if (stage !== 'typing') return;
        stage = 'full';
        clearTimeout(timer);
        target.textContent = full;
        target.classList.add('done');
        sign.classList.add('show');
        updateHint();
      }
      function enter() {
        if (stage !== 'full') return;
        stage = 'gone';
        document.removeEventListener('keydown', onkey);
        intro.classList.add('bye');
        setTimeout(() => {
          intro.remove();
          document.body.style.overflow = '';
        }, 850);
        try { sessionStorage.setItem('csc_intro_done', '1'); } catch (e) { }
      }
      function act() { if (stage === 'typing') reveal(); else if (stage === 'full') enter(); }
      function onkey() { act(); }
      function type() {
        if (stage !== 'typing') return;
        i++;
        target.textContent = full.slice(0, i);
        if (i >= full.length) { reveal(); return; }   /* 打完自动停在全文，等待再次确认进入 */
        const pause = '，。！：；、？'.includes(full.charAt(i - 1)) ? 120 : 0;
        timer = setTimeout(type, 24 + pause);
      }
      updateHint();
      timer = setTimeout(type, 500);
      intro.addEventListener('click', act);
      document.addEventListener('keydown', onkey);
      setTimeout(reveal, full.length * 46 + 2600);   /* 兜底：打字异常也至少显示全文（不自动进入） */
    }
    (function () {
      let reduced = false, seen = false;
      try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
      try { seen = !!sessionStorage.getItem('csc_intro_done'); } catch (e) { seen = true; }
      if (reduced || seen) removeStaticIntro(); else playIntro();
    })();



    /* ================= 全屏宽天空：夜=2D 星空画布（参照个人站 alidadei.github.io），昼=CSS 渐变（.sky-day） ================= */
    (function () {
      const c = document.getElementById('skyStars');
      if (!c || !c.getContext) return;
      let reduced = false;
      try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
      const ctx = c.getContext('2d');
      const isSmall = Math.min(window.innerWidth || 900, window.innerHeight || 700) < 768;
      const dpr = Math.min(window.devicePixelRatio || 1, isSmall ? 1.5 : 2);
      let W = 0, H = 0, off = null, last = 0, shootTimer = 4 + Math.random() * 6, shooters = [], twinkles = [];
      const starCols = [[255, 240, 200], [200, 220, 255], [255, 200, 150], [180, 200, 255], [255, 255, 230]];
      const medCols = ['200,215,255', '255,245,220', '180,200,255', '255,220,180'];
      let seed = 20260910;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      function init() {
        W = c.clientWidth; H = c.clientHeight;
        if (!W || !H) return;
        c.width = W * dpr; c.height = H * dpr;
        seed = 20260910; twinkles = []; shooters = [];
        off = document.createElement('canvas');
        off.width = W * dpr; off.height = H * dpr;
        const g = off.getContext('2d');
        g.scale(dpr, dpr);
        /* 深空底（调紫不调蓝，与藕荷紫夜同宗） */
        const bg = g.createRadialGradient(W * 0.5, H * 0.32, 0, W * 0.5, H * 0.32, Math.max(W, H) * 0.85);
        bg.addColorStop(0, '#251c3a'); bg.addColorStop(0.45, '#1c1530'); bg.addColorStop(1, '#120e20');
        g.fillStyle = bg; g.fillRect(0, 0, W, H);
        /* 银河带（微弱两层） */
        g.save(); g.translate(W * 0.42, H * 0.34); g.rotate(-0.5);
        for (let l = 0; l < 2; l++) {
          const mg = g.createRadialGradient(0, 0, 0, 0, 0, W * (0.28 + l * 0.1));
          const a = 0.06 - l * 0.02;
          mg.addColorStop(0, `rgba(155,145,205,${a})`);
          mg.addColorStop(0.5, `rgba(120,115,180,${a * 0.5})`);
          mg.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = mg; g.fillRect(-W * 0.6, -H * (0.05 + l * 0.03), W * 1.2, H * (0.1 + l * 0.06));
        }
        g.restore();
        /* 星云三团（藕荷紫系） */
        [[0.16, 0.3, 0.2, [130, 95, 190], 0.055], [0.8, 0.24, 0.16, [165, 120, 190], 0.05], [0.55, 0.68, 0.18, [100, 105, 175], 0.04]].forEach(n => {
          g.save(); g.translate(W * n[0], H * n[1]); g.scale(1, 0.55);
          const ng = g.createRadialGradient(0, 0, 0, 0, 0, Math.min(W, H) * n[2]);
          ng.addColorStop(0, `rgba(${n[3][0]},${n[3][1]},${n[3][2]},${n[4]})`);
          ng.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = ng; g.beginPath(); g.arc(0, 0, Math.min(W, H) * n[2], 0, Math.PI * 2); g.fill();
          g.restore();
        });
        /* 尘埃星 170（静态层） */
        for (let i = 0; i < 170; i++) {
          g.fillStyle = `rgba(205,196,235,${0.08 + rand() * 0.25})`;
          g.fillRect(rand() * W, rand() * H, 0.2 + rand() * 0.5, 0.2 + rand() * 0.5);
        }
        /* 闪烁星四层：微小星 60 轻闪 / 中 18 / 光晕 8 / 十字芒 2 */
        for (let i = 0; i < 60; i++) {
          const cc = starCols[(rand() * starCols.length) | 0];
          twinkles.push({ x: rand() * W, y: rand() * H, size: 0.5 + rand() * 0.8, base: 0.25 + rand() * 0.35, speed: 0.8 + rand() * 1.7, ph: rand() * Math.PI * 2, col: cc.join(','), small: true });
        }
        for (let i = 0; i < 18; i++) twinkles.push({ x: rand() * W, y: rand() * H, size: 1 + rand() * 1.1, base: 0.35 + rand() * 0.4, speed: 0.8 + rand() * 1.8, ph: rand() * Math.PI * 2, col: medCols[(rand() * medCols.length) | 0] });
        for (let i = 0; i < 8; i++) { const cc = starCols[(rand() * starCols.length) | 0]; twinkles.push({ x: rand() * W, y: rand() * H, size: 1.2 + rand() * 1.6, base: 0.85, speed: 0.4 + rand() * 1.1, ph: rand() * Math.PI * 2, col: cc.join(','), glow: true }); }
        for (let i = 0; i < 2; i++) { const cc = starCols[(rand() * starCols.length) | 0]; twinkles.push({ x: W * 0.08 + rand() * W * 0.84, y: H * 0.08 + rand() * H * 0.6, size: 1.8 + rand() * 1.8, base: 0.9, speed: 0.25 + rand() * 0.5, ph: rand() * Math.PI * 2, col: cc.join(','), spikes: true }); }
      }
      function draw(t, dt) {
        if (!off) return;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(off, 0, 0);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        for (const s of twinkles) {
          const flick = s.small
            ? (0.75 + 0.25 * Math.sin(t * s.speed + s.ph))
            : (0.5 + 0.5 * Math.sin(t * s.speed + s.ph));
          const alpha = s.small ? s.base * flick : s.base * (0.3 + 0.7 * flick);
          if (s.spikes) {
            const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 8);
            glow.addColorStop(0, `rgba(${s.col},${0.2 * flick})`);
            glow.addColorStop(0.2, `rgba(${s.col},${0.06 * flick})`);
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow; ctx.fillRect(s.x - s.size * 8, s.y - s.size * 8, s.size * 16, s.size * 16);
            ctx.fillStyle = `rgba(${s.col},${alpha})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = `rgba(${s.col},${0.35 * flick})`; ctx.lineWidth = 0.8;
            const L = s.size * 6;
            ctx.beginPath(); ctx.moveTo(s.x - L, s.y); ctx.lineTo(s.x + L, s.y); ctx.moveTo(s.x, s.y - L); ctx.lineTo(s.x, s.y + L); ctx.stroke();
          } else if (s.glow) {
            const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 5);
            glow.addColorStop(0, `rgba(${s.col},${0.22 * flick})`);
            glow.addColorStop(0.3, `rgba(${s.col},${0.05 * flick})`);
            glow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = glow; ctx.fillRect(s.x - s.size * 5, s.y - s.size * 5, s.size * 10, s.size * 10);
            ctx.fillStyle = `rgba(${s.col},${alpha})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
          } else {
            ctx.fillStyle = `rgba(${s.col},${alpha})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
          }
        }
        /* 流星：低频温和（7–16s 一颗） */
        shootTimer -= dt;
        if (shootTimer <= 0) {
          shootTimer = 7 + Math.random() * 9;
          const a = 0.3 + Math.random() * 0.5, sp = 240 + Math.random() * 200;
          shooters.push({ x: W * 0.1 + Math.random() * W * 0.65, y: Math.random() * H * 0.35, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.55 + Math.random() * 0.3, len: 34 + Math.random() * 46 });
        }
        for (let k = shooters.length - 1; k >= 0; k--) {
          const s = shooters[k];
          s.x += s.vx * dt; s.y += s.vy * dt; s.life -= s.decay * dt;
          if (s.life <= 0) { shooters.splice(k, 1); continue; }
          const tail = Math.min(s.len, s.life * 90);
          const sp = Math.hypot(s.vx, s.vy) || 1;
          const nx = s.x - s.vx / sp * tail, ny = s.y - s.vy / sp * tail;
          const grad = ctx.createLinearGradient(s.x, s.y, nx, ny);
          grad.addColorStop(0, `rgba(220,225,255,${0.7 * s.life})`);
          grad.addColorStop(1, 'rgba(220,225,255,0)');
          ctx.strokeStyle = grad; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(nx, ny); ctx.stroke();
        }
      }
      function frame(time) {
        const dt = Math.min((time - last) / 1000, 0.1);
        last = time;
        if ((window.__dayT || 0) < 0.97) draw(time / 1000, dt);   /* 白天画布已被 CSS 隐藏，跳过绘制省电 */
        requestAnimationFrame(frame);
      }
      function start() {
        init();
        if (reduced) { draw(0, 0); return; }   /* 静态一帧：星空在，不闪不流星 */
        requestAnimationFrame(frame);
      }
      start();
      let rT = null;
      window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { init(); if (reduced) draw(0, 0); }, 200); });
    })();

    /* ================= 启动 ================= */
    applyLang();
    setInterval(() => { if (window.__themeTick) window.__themeTick(); }, 600000);   /* 页面久开：配色随时辰缓移 */
    refresh();
  </script>
